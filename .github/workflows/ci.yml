name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Python quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

  markdown-links:
    name: Documentation links
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check for broken local documentation links
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          from urllib.parse import urlparse

          skip = {".venv", "node_modules", ".git", "dist"}
          markdown_files = [
              path for path in Path(".").rglob("*.md") if not skip & set(path.parts)
          ]
          broken_links = []

          for markdown_file in markdown_files:
              text = markdown_file.read_text(encoding="utf-8")
              links = re.findall(r"\[[^\]]+\]\(([^)]+)\)", text)
              for link in links:
                  parsed = urlparse(link)
                  if parsed.scheme or parsed.netloc or link.startswith("#"):
                      continue
                  if not parsed.path:
                      continue
                  # Markdown relative links resolve against the file that
                  # contains them, not the repository root -- which is how
                  # GitHub renders them. Resolving from the root only happened
                  # to work while every link lived in a top-level file.
                  target = (markdown_file.parent / parsed.path).resolve()
                  if not target.exists():
                      broken_links.append(f"{markdown_file}: {link}")

          if broken_links:
              raise SystemExit("\n".join(broken_links))
          PY

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Test
        working-directory: frontend
        run: npm run test -- --run

      - name: Build
        working-directory: frontend
        run: npm run build
